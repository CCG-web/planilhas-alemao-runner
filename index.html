<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta Tags para Compartilhamento Bonito no WhatsApp / Redes Sociais -->
    <meta property="og:title" content="Alemão Runner | Gerador de Planilhas de Corrida">
    <meta property="og:description" content="Gere sua planilha de 5km ou 10km personalizada com metas de pace e treinos estruturados. Evolua com segurança!">
    <meta property="og:image" content="https://i.imgur.com/link_da_sua_foto_aqui.png">
    <meta property="og:url" content="https://ccg-web.github.io/planilhas-alemao-runner/">
    <meta property="og:type" content="website">
    <title>Alemão Runner - Gerador de Planilhas</title>
    <style>
        /* === ESTILOS GERAIS === */
        :root {
            --bg-color: #f5f5f5;
            --text-color: #2c3e50;
            --primary: #1a1a1a;
            --accent: #d4af37;
            --accent-dark: #b8860b;
            --border-color: #404040;
            --table-border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); }
        
        /* === NAVBAR ALEMÃO RUNNER === */
        .navbar {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-bottom: 3px solid #d4af37;
        }
        .navbar .brand {
            color: #d4af37;
            font-size: 1.5em;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar .social-link {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .navbar .social-link:hover { opacity: 0.8; transform: scale(1.05); }

        /* === CONTAINER PRINCIPAL === */
        .container { padding: 20px; max-width: 900px; margin: 0 auto; }

        /* === ESTILOS DO FORMULÁRIO === */
        .admin-panel {
            background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px; border-top: 4px solid #1a1a1a;
        }
        .admin-panel h2 { color: #1a1a1a; margin-top: 0; font-size: 1.4em; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row > div { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus { border-color: #d4af37; outline: none; }
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; color: #6c757d; font-weight: bold; }

        .days-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .days-group label { font-weight: normal; background: #eee; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.9em; flex: 1; text-align: center; min-width: 50px;}
        .days-group input:checked + label { background: #1a1a1a; color: #d4af37; font-weight: bold; }
        
        button {
            background-color: #1a1a1a; color: #d4af37; border: 2px solid #d4af37;
            padding: 12px 20px; font-size: 1.1em; font-weight: bold; border-radius: 4px; cursor: pointer;
            width: 100%; text-transform: uppercase; transition: 0.3s; margin-top: 10px;
        }
        button:hover { background-color: #d4af37; color: #1a1a1a; }

        .print-btn { background-color: #27ae60; border-color: #2ecc71; color: white; display: none; }
        .print-btn:hover { background-color: #2ecc71; color: white; }

        /* === ESTILOS DA PLANILHA BASE === */
        #planilha-output { display: none; background: #fff; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
        
        /* Tema Premium (Preto e Dourado) */
        .theme-premium {
            --primary: #1a1a1a; --accent: #d4af37; --accent-dark: #b8860b; --border-color: #404040;
            --bg-rule: #fbf9f1; --bg-run: #fdfaf0; --color-run: #8a6d3b; --bg-race: #fef0f0; --header-text: #d4af37;
        }

        /* Tema Padrão Gratuito (Azul e Branco) */
        .theme-gratis {
            --primary: #1a365d; --accent: #3182ce; --accent-dark: #2b6cb0; --border-color: #cbd5e0;
            --bg-rule: #f0f7ff; --bg-run: #ebf8ff; --color-run: #2b6cb0; --bg-race: #fed7d7; --header-text: #ffffff;
        }

        .header { background-color: var(--primary); color: #fff; padding: 20px; border-radius: 6px; margin-bottom: 15px; border: 2px solid var(--accent); }
        .header h1 { margin: 0; font-size: 16pt; color: var(--header-text); }
        .header p { margin: 5px 0 0 0; font-size: 9.5pt; opacity: 0.9; }
        .license { margin-top: 10px; font-size: 9pt; color: var(--accent); border-top: 1px solid var(--border-color); padding-top: 8px; font-weight: bold; text-transform: uppercase; }
        
        .rule-box { background-color: var(--bg-rule); border: 1px solid var(--accent); border-radius: 4px; padding: 12px; margin-bottom: 15px; font-size: 9.5pt; line-height: 1.4; color: #2c3e50; }
        .rule-box strong { color: var(--accent-dark); }
        .disclaimer-box { background-color: #fff3cd; border: 1px solid #ffe69c; color: #856404; border-radius: 4px; padding: 12px; margin-bottom: 15px; font-size: 9pt; line-height: 1.4; }
        .upsell-box { background-color: #e6f7ff; border: 1px solid #90cdf4; color: #2c5282; border-radius: 4px; padding: 12px; margin-bottom: 15px; font-size: 9.5pt; line-height: 1.4; font-weight: bold; text-align: center; }

        .section-title { font-size: 11pt; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 8px; margin-top: 20px; margin-bottom: 8px; font-weight: bold; }
        
        .table-responsive { overflow-x: auto; margin-bottom: 15px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; font-size: 9pt; color: #2c3e50; }
        th { background-color: var(--primary); color: var(--header-text); font-weight: bold; text-align: left; padding: 10px; border: 1px solid var(--border-color); text-transform: uppercase; }
        td { padding: 10px; border: 1px solid var(--table-border); text-align: left; }
        tr:nth-child(even) td { background-color: #fafafa; }
        .highlight-run td { background-color: var(--bg-run) !important; font-weight: bold; color: var(--color-run); }
        .highlight-race td { background-color: var(--bg-race) !important; font-weight: bold; color: #c53030; }
        
        .footer-signature { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; font-size: 9pt; color: #666; text-align: center; }

        /* === SISTEMA DE BLOQUEIO (PREVIEW) === */
        .premium-lock-container { position: relative; margin-top: 20px; padding-bottom: 20px; }
        .premium-blurred { filter: blur(6px); user-select: none; pointer-events: none; opacity: 0.5; }
        .lock-overlay {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(26, 26, 26, 0.95); color: #d4af37; padding: 30px; border-radius: 8px;
            text-align: center; border: 2px solid #d4af37; z-index: 10; width: 90%; max-width: 500px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .lock-overlay h3 { margin-top: 0; font-size: 1.4em; }
        .lock-overlay p { font-size: 1em; color: #f5f5f5; line-height: 1.4; }
        .btn-whatsapp {
            background-color: #25D366; color: white; border: none; padding: 15px 20px;
            font-size: 1.1em; font-weight: bold; border-radius: 4px; cursor: pointer;
            width: 100%; margin-top: 15px; text-decoration: none; display: inline-block;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-whatsapp:hover { background-color: #128C7E; transform: scale(1.02); }

        /* === RESPONSIVIDADE MOBILE === */
        @media (max-width: 600px) {
            .navbar { flex-direction: column; gap: 10px; padding: 10px; }
            .form-row { flex-direction: column; gap: 0; }
            .admin-panel { padding: 15px; }
            .header h1 { font-size: 14pt; }
        }

        /* === REGRAS DE IMPRESSÃO === */
        @media print {
            body { background: #fff; padding: 0; }
            .navbar, .admin-panel, .lock-overlay { display: none !important; }
            .container { padding: 0; max-width: 100%; }
            #planilha-output { display: block; box-shadow: none; padding: 0; }
            .premium-blurred { filter: none !important; opacity: 1 !important; }
            .table-responsive { overflow-x: visible; }
            table { page-break-inside: avoid; min-width: 100%; }
            .section-title { page-break-after: avoid; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR ALEMÃO RUNNER -->
    <nav class="navbar" id="navbar">
        <a href="#" class="brand">🏃‍♂️ Alemão Runner</a>
        <a href="https://instagram.com/alemao_runner" target="_blank" class="social-link">📸 Seguir no Instagram</a>
    </nav>

    <div class="container">
        <!-- PAINEL DO ATLETA/TREINADOR -->
        <div class="admin-panel" id="admin-panel">
            <h2>⚙️ Crie Seu Planejamento</h2>
            <form id="generatorForm">
                
                <div class="form-group" style="background: #fdfaf0; padding: 15px; border: 1px solid #d4af37; border-radius: 6px;">
                    <label style="color: #b8860b;">Nível do Plano</label>
                    <select id="tipoPlano" style="font-weight: bold;">
                        <option value="gratis">Plano Gratuito (1 Semana de Amostra)</option>
                        <option value="premium">Plano Premium (8 Semanas - Ciclo Completo)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Seu Nome</label>
                        <input type="text" id="atletaName" required placeholder="Ex: alemão runner">
                    </div>
                    <div class="form-group">
                        <label>Seu Telefone/Instagram</label>
                        <input type="text" id="atletaPhone" required placeholder="Ex: +55 88 9999-9999">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Distância Alvo</label>
                        <select id="distanciaAlvo">
                            <option value="5km">5 km</option>
                            <option value="10km">10 km</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tempo Atual (MM:SS)</label>
                        <input type="text" id="tempoAtual" required placeholder="Ex: 21:20" pattern="[0-9]{2}:[0-9]{2}">
                    </div>
                    <div class="form-group">
                        <label>Tempo Alvo (-30 Segundos)</label>
                        <input type="text" id="tempoAlvo" readonly placeholder="Calculado Automaticamente">
                    </div>
                </div>

                <div class="form-group">
                    <label>Quais dias você pode treinar? (Selecione pelo menos 3)</label>
                    <div class="days-group">
                        <input type="checkbox" id="d1" value="Segunda" hidden><label for="d1">Seg</label>
                        <input type="checkbox" id="d2" value="Terça" hidden><label for="d2">Ter</label>
                        <input type="checkbox" id="d3" value="Quarta" hidden><label for="d3">Qua</label>
                        <input type="checkbox" id="d4" value="Quinta" hidden><label for="d4">Qui</label>
                        <input type="checkbox" id="d5" value="Sexta" hidden><label for="d5">Sex</label>
                        <input type="checkbox" id="d6" value="Sábado" hidden><label for="d6">Sáb</label>
                        <input type="checkbox" id="d7" value="Domingo" hidden><label for="d7">Dom</label>
                    </div>
                </div>

                <button type="submit">🚀 Gerar Prévia da Planilha</button>
                <button type="button" class="print-btn" id="printBtn" onclick="window.print()">🖨️ Salvar PDF Grátis</button>
            </form>
        </div>

        <!-- RESULTADO DA PLANILHA -->
        <div id="planilha-output">
            <!-- Renderizado pelo JavaScript -->
        </div>
    </div>

    <script>
        function timeToSeconds(timeStr) {
            let parts = timeStr.split(':');
            if (parts.length !== 2) return 0;
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function secondsToTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        document.getElementById('tempoAtual').addEventListener('input', function() {
            const atualStr = this.value;
            if (atualStr && atualStr.match(/^\d{2}:\d{2}$/)) {
                const atualSec = timeToSeconds(atualStr);
                const alvoSec = atualSec - 30;
                
                if (alvoSec > 0) {
                    document.getElementById('tempoAlvo').value = secondsToTime(alvoSec);
                } else {
                    document.getElementById('tempoAlvo').value = "";
                }
            } else {
                document.getElementById('tempoAlvo').value = "";
            }
        });

        document.getElementById('generatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const tipoPlano = document.getElementById('tipoPlano').value;
            const isPremium = tipoPlano === 'premium';
            const totalSemanas = 8; 

            const nome = document.getElementById('atletaName').value;
            const telefone = document.getElementById('atletaPhone').value;
            const distancia = document.getElementById('distanciaAlvo').value;
            const atualStr = document.getElementById('tempoAtual').value;
            const alvoStr = document.getElementById('tempoAlvo').value;
            
            if (!alvoStr) {
                alert("Insira um Tempo Atual válido (MM:SS) para calcular o alvo."); return;
            }

            const tempoAtualSec = timeToSeconds(atualStr);
            const tempoAlvoSec = timeToSeconds(alvoStr);

            const limite5km = 12 * 60 + 30; 
            const limite10km = 26 * 60 + 10; 

            if (distancia === '5km' && (tempoAlvoSec < limite5km || tempoAtualSec < limite5km)) {
                alert("⚠️ O recorde mundial dos 5km é 12:35. Insira um tempo realístico!"); return;
            }
            if (distancia === '10km' && (tempoAlvoSec < limite10km || tempoAtualSec < limite10km)) {
                alert("⚠️ O recorde mundial dos 10km é 26:11. Insira um tempo realístico!"); return;
            }

            const diasSelecionados = [];
            document.querySelectorAll('.days-group input:checked').forEach(cb => diasSelecionados.push(cb.value));

            if(diasSelecionados.length < 3) {
                alert("Selecione pelo menos 3 dias de treino na semana!"); return;
            }

            const distKm = distancia === '5km' ? 5 : 10;
            const paceAlvoSec = Math.floor(tempoAlvoSec / distKm);

            const paceProva = `${secondsToTime(paceAlvoSec - 3)} a ${secondsToTime(paceAlvoSec + 2)}`;
            const paceTiros = `Tiros a ${secondsToTime(paceAlvoSec - 10)}`;
            const paceTempoRun = `Forte a ${secondsToTime(paceAlvoSec + 10)}`;
            const paceLeve = `${secondsToTime(paceAlvoSec + 40)} a ${secondsToTime(paceAlvoSec + 60)}`;
            const paceRegenerativo = `${secondsToTime(paceAlvoSec + 60)} a ${secondsToTime(paceAlvoSec + 80)}`;

            const tituloHeader = isPremium ? `🏆 PLANILHA PREMIUM (PRÉVIA)` : `🏃 PLANILHA DEMONSTRAÇÃO (1 SEMANA)`;
            const licencaTexto = isPremium ? `★ Versão Bloqueada - Aguardando Pagamento` : `Plano Gratuito | Atleta: ${nome}`;

            let html = `
                <div class="header">
                    <h1>Foco ${distancia} | ${tituloHeader}</h1>
                    <p><strong>Atleta:</strong> ${nome} | <strong>Nível Atual:</strong> ${atualStr} | <strong>Alvo Fixo:</strong> Sub ${alvoStr} (-30s)</p>
                    <p><strong>Frequência:</strong> ${diasSelecionados.length} Dias por Semana</p>
                    <div class="license">${licencaTexto}</div>
                </div>
                
                <div class="disclaimer-box">
                    <strong>⚠️ Observação Importante:</strong> Esta planilha foi elaborada utilizando as melhores práticas atuais para o treinamento de corrida de rua. Porém, para maiores orientações e adaptações específicas, procure sempre um Profissional de Educação Física.
                </div>
            `;

            if (!isPremium) {
                html += `
                <div class="upsell-box">
                    🚀 <strong>Gostou do treino?</strong> Esta é apenas uma amostra de 1 semana. Para desbloquear o ciclo completo de 8 semanas com polimento final, gere a versão Premium!
                </div>`;
            }

            html += `
                <div class="rule-box">
                    <strong>Estratégia:</strong> O foco deste ciclo é quebrar o platô atual garantindo a progressão segura e fixada de 30 segundos. Os treinos foram distribuídos matematicamente para construir resistência aeróbica e velocidade de forma progressiva.
                </div>
                <div style="font-size: 9.5pt; margin-bottom: 15px; color: var(--text-color);">
                    <strong>Zonas de Ritmo Alvo:</strong><br>
                    • Pace de Prova (Alvo Sub ${alvoStr}): ~${paceProva} / km<br>
                    • Limiar / Tempo Run: ~${paceTempoRun} / km<br>
                    • Rodagem Leve (Z2): ~${paceLeve} / km<br>
                    • Regenerativo: ~${paceRegenerativo} / km
                </div>
            `;

            const tiposTreino = [
                { nome: `Tiros Curtos: 15min aquec. + 10x 400m / int. 1:00`, pace: paceTiros, class: 'highlight-run' },
                { nome: `Rodagem Leve: 40 min`, pace: paceLeve, class: '' },
                { nome: `Tempo Run: 15min aquec. + 4km ritmo forte`, pace: paceTempoRun, class: 'highlight-run' },
                { nome: `Longão: ${distancia === '5km' ? '12km' : '16km'} confortável`, pace: paceLeve, class: '' },
                { nome: `Regenerativo: 30 min`, pace: paceRegenerativo, class: '' },
                { nome: `Fartlek: 10x (1min forte/1min leve)`, pace: paceTempoRun, class: 'highlight-run' },
                { nome: `Tiros Longos: 15min aquec. + 5x 1000m / int. 2:00`, pace: paceTiros, class: 'highlight-run' }
            ];

            // Renderizar Semana 1 (Sempre visível)
            html += `<div class="section-title">Semana 1 - Base e Adaptação</div>`;
            html += `<div class="table-responsive"><table><thead><tr><th style="width: 15%;">Dia</th><th style="width: 65%;">Treino</th><th style="width: 20%;">Pace Alvo</th></tr></thead><tbody>`;
            
            let diaCompleto = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
            let treinoIndex = 0; 

            diaCompleto.forEach(dia => {
                if (diasSelecionados.includes(dia)) {
                    let treino = tiposTreino[treinoIndex % tiposTreino.length];
                    html += `<tr class="${treino.class}"><td>${dia}</td><td>${treino.nome}</td><td>${treino.pace}</td></tr>`;
                    treinoIndex++;
                } else {
                    html += `<tr><td>${dia}</td><td>Descanso Total</td><td>-</td></tr>`;
                }
            });
            html += `</tbody></table></div>`;

            // Lógica de Bloqueio se for Premium
            if (isPremium) {
                // SEU NÚMERO ATUALIZADO AQUI
                const meuWhatsApp = "5588997041286"; 
                const msgZap = encodeURIComponent(`Fala, Alemão Runner! Acabei de gerar minha prévia da Planilha Premium de ${distancia}. Meu tempo atual é ${atualStr} e o alvo é ${alvoStr}. Como faço o Pix de R$25,00 para você me enviar o PDF completo liberado?`);
                const linkZap = `https://wa.me/${meuWhatsApp}?text=${msgZap}`;

                html += `<div class="premium-lock-container">`;
                
                // Overlay de Bloqueio e Botão
                html += `
                <div class="lock-overlay">
                    <h3>🔒 PLANILHA BLOQUEADA</h3>
                    <p>Sua progressão de 8 semanas para buscar o <strong>Sub ${alvoStr}</strong> está calculada e pronta!</p>
                    <p>A estruturação completa custa apenas <strong>R$ 25,00</strong>. Clique no botão abaixo para me mandar mensagem no WhatsApp e receber seu PDF liberado na hora.</p>
                    <a href="${linkZap}" target="_blank" class="btn-whatsapp">📲 Quero Desbloquear (WhatsApp)</a>
                </div>
                `;

                // Conteúdo Borrado (Semanas 2 a 8)
                html += `<div class="premium-blurred">`;
                for (let s = 2; s <= 8; s++) {
                    let tituloSemana = s === 8 ? `Semana 8 - Polimento e Simulado de Prova` : `Semana ${s} - Progressão de Carga`;
                    html += `<div class="section-title">${tituloSemana}</div>`;
                    html += `<div class="table-responsive"><table><thead><tr><th style="width: 15%;">Dia</th><th style="width: 65%;">Treino</th><th style="width: 20%;">Pace Alvo</th></tr></thead><tbody>`;

                    diaCompleto.forEach(dia => {
                        if (diasSelecionados.includes(dia)) {
                            let treino = tiposTreino[treinoIndex % tiposTreino.length];
                            if (s === 8 && dia === diasSelecionados[diasSelecionados.length - 1]) {
                                html += `<tr class="highlight-race"><td>${dia}</td><td>SIMULADO ALVO DE ${distancia}. Vai pra cima!</td><td>Sub ${alvoStr}</td></tr>`;
                            } else {
                                html += `<tr class="${treino.class}"><td>${dia}</td><td>${treino.nome}</td><td>${treino.pace}</td></tr>`;
                                treinoIndex++;
                            }
                        } else {
                            html += `<tr><td>${dia}</td><td>Descanso Total</td><td>-</td></tr>`;
                        }
                    });
                    html += `</tbody></table></div>`;
                }
                html += `</div></div>`; // Fim blurred e container
            }

            const outputDiv = document.getElementById('planilha-output');
            const printBtn = document.getElementById('printBtn');
            
            outputDiv.className = isPremium ? 'theme-premium' : 'theme-gratis';
            outputDiv.innerHTML = html;
            outputDiv.style.display = 'block';
            
            if(isPremium) {
                printBtn.style.display = 'none';
            } else {
                printBtn.style.display = 'block';
            }
            
            outputDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    </script>
</body>
</html>
